<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.55" stop-color="#12052e"/>
      <stop offset="1" stop-color="#1d0647"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9d4dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9d4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3cac" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3cac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e2c8ff"/>
      <stop offset="1" stop-color="#b47cff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#d48a00"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f00ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="300" width="1200" height="160" fill="url(#fadeGrid)"/></mask>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      .tw2{animation:tw 4.5s ease-in-out infinite 1s}
      .tw3{animation:tw 2.4s ease-in-out infinite .5s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .pulse{animation:pulse 6s ease-in-out infinite;transform-origin:600px 200px}
      @keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
      .gridmove{animation:gm 2.5s linear infinite}
      @keyframes gm{0%{transform:translateY(0)}100%{transform:translateY(32px)}}
      .orbit{animation:orb 18s linear infinite;transform-origin:600px 200px}
      @keyframes orb{to{transform:rotate(360deg)}}
      .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .mono{font-family:Consolas,'SF Mono',Menlo,monospace}
    </style>
  </defs>

  <clipPath id="r"><rect width="1200" height="460" rx="22"/></clipPath><g clip-path="url(#r)"><rect width="1200" height="460" fill="url(#bg)"/>

  <!-- nebulosas -->
  <circle class="pulse" cx="600" cy="200" r="340" fill="url(#glowA)"/>
  <circle cx="1050" cy="80" r="260" fill="url(#glowB)"/>
  <circle cx="120" cy="380" r="220" fill="url(#glowB)" opacity="0.6"/>

  <!-- estrelas -->
  <g fill="#fff">
    <circle class="tw" cx="80" cy="60" r="1.6"/><circle class="tw2" cx="210" cy="130" r="1.1"/>
    <circle class="tw3" cx="320" cy="40" r="1.4"/><circle class="tw" cx="430" cy="110" r="0.9"/>
    <circle class="tw2" cx="760" cy="50" r="1.3"/><circle class="tw3" cx="860" cy="140" r="1"/>
    <circle class="tw" cx="980" cy="30" r="1.5"/><circle class="tw2" cx="1110" cy="170" r="1.2"/>
    <circle class="tw3" cx="1160" cy="60" r="0.9"/><circle class="tw" cx="40" cy="220" r="1"/>
    <circle class="tw2" cx="150" cy="280" r="1.3"/><circle class="tw3" cx="1060" cy="260" r="1.1"/>
    <circle class="tw" cx="690" cy="30" r="1"/><circle class="tw2" cx="520" cy="60" r="1.2"/>
    <circle class="tw3" cx="260" cy="220" r="0.8"/><circle class="tw" cx="940" cy="220" r="0.9"/>
  </g>

  <!-- chão em grade (perspectiva) -->
  <g mask="url(#gridMask)" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1">
    <g class="gridmove">
      <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="332" x2="1200" y2="332"/>
      <line x1="0" y1="364" x2="1200" y2="364"/><line x1="0" y1="396" x2="1200" y2="396"/>
      <line x1="0" y1="428" x2="1200" y2="428"/><line x1="0" y1="460" x2="1200" y2="460"/>
    </g>
    <line x1="600" y1="300" x2="600" y2="460"/>
    <line x1="560" y1="300" x2="400" y2="460"/><line x1="640" y1="300" x2="800" y2="460"/>
    <line x1="520" y1="300" x2="200" y2="460"/><line x1="680" y1="300" x2="1000" y2="460"/>
    <line x1="480" y1="300" x2="0" y2="460"/><line x1="720" y1="300" x2="1200" y2="460"/>
    <line x1="440" y1="300" x2="-200" y2="460"/><line x1="760" y1="300" x2="1400" y2="460"/>
  </g>

  <!-- órbita -->
  <g class="orbit">
    <ellipse cx="600" cy="200" rx="300" ry="300" fill="none" stroke="#c084fc" stroke-opacity="0.12" stroke-dasharray="2 10"/>
    <circle cx="900" cy="200" r="4" fill="#e9d5ff" filter="url(#glow)"/>
    <circle cx="300" cy="200" r="2.5" fill="#ff8ad8" filter="url(#glow)"/>
  </g>

  <!-- coroa -->
  <g class="float" filter="url(#glow)">
    <path d="M556 92 L568 58 L586 80 L600 46 L614 80 L632 58 L644 92 Z" fill="url(#gold)"/>
    <rect x="556" y="92" width="88" height="10" rx="3" fill="url(#gold)"/>
    <circle cx="600" cy="46" r="5" fill="#fff3b0"/>
    <circle cx="568" cy="58" r="4" fill="#fff3b0"/>
    <circle cx="632" cy="58" r="4" fill="#fff3b0"/>
    <circle cx="600" cy="84" r="4" fill="#c084fc"/>
  </g>

  <!-- título -->
  <text x="600" y="198" text-anchor="middle" class="sans" font-size="96" font-weight="800" letter-spacing="10" fill="#7f00ff" opacity="0.5" filter="url(#blur)">LORDEHOST</text>
  <text x="600" y="198" text-anchor="middle" class="sans" font-size="96" font-weight="800" letter-spacing="10" fill="url(#title)">LORDEHOST</text>

  <rect x="350" y="224" width="500" height="2" fill="url(#line)"/>
  <rect class="scan" x="350" y="223" width="120" height="4" fill="#fff" opacity="0.7" filter="url(#blur)"/>

  <text x="600" y="262" text-anchor="middle" class="sans" font-size="21" font-weight="600" letter-spacing="7" fill="#e9d5ff">INFRAESTRUTURA PREMIUM PARA BOTS E APLICAÇÕES</text>

  <!-- chips -->
  <g class="mono" font-size="14" font-weight="700" letter-spacing="2">
    <g transform="translate(330,292)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c084fc" stroke-opacity="0.6"/>
      <circle cx="22" cy="17" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="90" y="22" text-anchor="middle" fill="#fff">ONLINE</text>
    </g>
    <g transform="translate(520,292)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c084fc" stroke-opacity="0.6"/>
      <text x="80" y="22" text-anchor="middle" fill="#fff">PERFORMANCE</text>
    </g>
    <g transform="translate(710,292)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c084fc" stroke-opacity="0.6"/>
      <text x="80" y="22" text-anchor="middle" fill="#fff">PROTEGIDA</text>
    </g>
  </g>

  </g>
  <!-- borda -->
  <rect x="0.5" y="0.5" width="1199" height="459" rx="22" fill="none" stroke="#a855f7" stroke-opacity="0.35"/>
</svg>
