<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a5e"/><stop offset="0.6" stop-color="#14052f"/><stop offset="1" stop-color="#3b0a4a"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="h" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>
      .s{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .m{font-family:Consolas,Menlo,monospace}
      .p{animation:p 2.2s ease-in-out infinite;transform-origin:600px 222px}
      @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
      .r{animation:r 2.2s ease-out infinite;transform-origin:600px 222px}
      @keyframes r{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle cx="600" cy="230" r="260" fill="url(#h)"/>
    <g stroke="#c084fc" stroke-opacity="0.08">
      <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="200" y1="0" x2="200" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/><line x1="1000" y1="0" x2="1000" y2="300"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="24" fill="none" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.5"/>

  <text x="600" y="78" text-anchor="middle" class="s" font-size="42" font-weight="800" fill="url(#t)">Seu projeto merece um trono.</text>
  <text x="600" y="120" text-anchor="middle" class="s" font-size="19" fill="#d6c8f5">Fale agora com o dono da Lordehost e coloque seu bot no lugar que ele merece.</text>

  <rect class="r" x="380" y="186" width="440" height="72" rx="36" fill="none" stroke="#4ade80" stroke-width="2"/>
  <g class="p">
    <rect x="380" y="186" width="440" height="72" rx="36" fill="url(#btn)"/>
    <circle cx="430" cy="222" r="20" fill="#fff" fill-opacity="0.2"/>
    <path d="M421 233 L424 224 A11 11 0 1 1 428 229 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="620" y="216" text-anchor="middle" class="s" font-size="22" font-weight="800" fill="#fff" letter-spacing="2">FALAR COM O DONO</text>
    <text x="620" y="241" text-anchor="middle" class="m" font-size="16" fill="#dcfce7" letter-spacing="1">+55 (66) 9923-2131</text>
  </g>
</svg>
