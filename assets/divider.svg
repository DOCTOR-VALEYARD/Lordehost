<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f00ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7f00ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="3"/></filter>
    <style>.s{animation:s 3.5s linear infinite}@keyframes s{from{transform:translateX(-200px)}to{transform:translateX(1200px)}}</style>
