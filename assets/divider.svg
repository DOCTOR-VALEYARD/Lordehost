  <rect x="100" y="19" width="1000" height="2" fill="url(#g)"/>
  <rect class="s" x="0" y="17" width="160" height="6" rx="3" fill="#f0abfc" opacity="0.8" filter="url(#b)"/>
  <g transform="translate(600,20)">
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#0b0420" stroke="#c084fc" stroke-width="2"/>
