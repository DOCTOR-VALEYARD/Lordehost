<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140830"/>
      <stop offset="1" stop-color="#07021a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1260"/>
      <stop offset="1" stop-color="#1a0a40"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#ff3cac" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f00ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7f00ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="40" y="20" width="1120" height="390" rx="18"/></clipPath>
    <style>
      .m{font-family:Consolas,'SF Mono',Menlo,'Courier New',monospace;font-size:19px}
      .l{opacity:0;animation:show .35s ease-out forwards}
      @keyframes show{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
      .d1{animation-delay:.4s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}.d4{animation-delay:2.3s}
      .d5{animation-delay:2.9s}.d6{animation-delay:3.5s}.d7{animation-delay:4.1s}.d8{animation-delay:4.9s}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .p{fill:#c084fc}.g{fill:#4ade80}.w{fill:#f5f3ff}.s{fill:#8b7bb5}.y{fill:#facc15}.pk{fill:#ff7ad9}
    </style>
  </defs>

  <ellipse cx="600" cy="215" rx="620" ry="240" fill="url(#glow)"/>

  <g clip-path="url(#clip)">
    <rect x="40" y="20" width="1120" height="390" fill="url(#win)"/>
    <rect x="40" y="20" width="1120" height="48" fill="url(#bar)"/>
    <circle cx="74" cy="44" r="7" fill="#ff5f57"/>
    <circle cx="98" cy="44" r="7" fill="#febc2e"/>
    <circle cx="122" cy="44" r="7" fill="#28c840"/>
    <text x="600" y="50" text-anchor="middle" class="m" font-size="15" fill="#cbbde8" letter-spacing="2">lordehost  —  painel  —  console</text>
    <g transform="translate(1030,32)">
      <rect width="108" height="24" rx="12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.7"/>
      <circle cx="16" cy="12" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="64" y="17" text-anchor="middle" class="m" font-size="12" font-weight="700" fill="#4ade80">ONLINE</text>
    </g>

    <g class="m" xml:space="preserve">
      <text x="72" y="112" class="l d1"><tspan class="pk">container@lordehost</tspan><tspan class="s">:</tspan><tspan class="p">~</tspan><tspan class="w">$ npm start</tspan></text>
      <text x="72" y="148" class="l d2"><tspan class="p">[LORDEHOST]</tspan><tspan class="w" x="240">Iniciando servidor dedicado ...</tspan></text>
      <text x="72" y="184" class="l d3"><tspan class="p">[LORDEHOST]</tspan><tspan class="w" x="240">Recursos isolados alocados</tspan><tspan class="g" x="720">[ OK ]</tspan></text>
      <text x="72" y="220" class="l d4"><tspan class="p">[LORDEHOST]</tspan><tspan class="w" x="240">Rede protegida ativa</tspan><tspan class="g" x="720">[ OK ]</tspan></text>
      <text x="72" y="256" class="l d5"><tspan class="y">[ BOT ]</tspan><tspan class="w" x="240">Conectando ao WhatsApp ...</tspan></text>
      <text x="72" y="292" class="l d6"><tspan class="y">[ BOT ]</tspan><tspan class="w" x="240">Conectado com sucesso</tspan><tspan class="g" x="720">[ OK ]</tspan></text>
      <text x="72" y="328" class="l d7"><tspan class="y">[ BOT ]</tspan><tspan class="w" x="240">Comando recebido  </tspan><tspan class="s">→</tspan><tspan class="w">  respondido </tspan><tspan class="g">na hora</tspan></text>
      <text x="72" y="372" class="l d8"><tspan class="pk">container@lordehost</tspan><tspan class="s">:</tspan><tspan class="p">~</tspan><tspan class="w">$ </tspan><tspan class="cur w">█</tspan></text>
    </g>
  </g>
  <rect x="40.75" y="20.75" width="1118.5" height="388.5" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
